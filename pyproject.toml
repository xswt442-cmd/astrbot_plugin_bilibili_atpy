[project]
name = "astrbot-plugin-bilibili-atpy"
version = "0.1.8"
description = "每天刷几个怪视频，@朋友，留一句锐评。"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11.18,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atpy"]
