name: astrbot_plugin_bilibili_atpy
display_name: atpy
short_desc: 每天挑个视频，@朋友，留一句锐评。
desc: 用你自己的B站账号每天挑一个视频，让模型写一句十字以内的锐评，@ 几个朋友发在评论区，结果同步到 QQ 群。五类内容（搞笑搞怪 / 莫名其妙 / 二游 / 王者荣耀 / 无畏契约）按日期轮转。
version: v0.1.10
author: xswt442-cmd
repo: https://github.com/xswt442-cmd/astrbot_plugin_bilibili_atpy
astrbot_version: ">=4.16,<5"
# 图标。市场拿仓库根的 logo.png（256×256）当插件图标，
# icon/ 是 1MB 以上的源图，.gitattributes 里排除了，不进发布包。
# 市场分类。取值是市场自己定的那几个中文，见 docs/RELEASING.md。
# 不填会被默认成「其他」，在插件详情页显示成 [MISSING: ...其他]。
category: 娱乐
# 标签用于市场搜索。惯例是「平台/大类」+ 具体玩法。
tags:
  - B站
  - 锐评
  - 整活
  - 定时任务
support_platforms:
  - aiocqhttp
  - qq_official
  - weixin_oc
