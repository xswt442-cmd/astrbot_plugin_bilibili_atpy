name: checks

on:
  # 门禁要跑在改动还能被处理的地方。只有 push 和定时任务时，第一个信号
  # 是合并提交把 main 弄红，而合并请求可能从未被测过。
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]

# 每个分支一次运行：一串提交会互相取消，而不是把完整的检查排在彼此后面。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 准备 Python
        run: uv python install

      - name: 安装依赖
        run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: 格式检查
        run: uv run ruff format --check .

      - name: 测试
        run: uv run pytest -q

  # B站的搜索接口没有公开文档，字段名与排序值都可能改版。单测钉得住过滤
  # 逻辑，钉不住「接口还在不在、字段还在不在」——播放量字段改名，构造数据
  # 照样能过。所以定时打真实接口对照。
  #
  # 搜索不需要登录态，匿名就能跑，所以这里能验到底。
  live:
    name: 真实接口验证
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 准备 Python
        run: uv python install

      - name: 同步依赖
        run: uv sync --locked

      - name: 搜索接口还通
        run: uv run python test/verify_search.py
